stages:
  - build
  - test

build:
  stage: build
  image: python:3.12
  script:
    - python --version
    - python -m pip install pytest
    - python -m py_compile calculator.py test_calculator.py

test:
  stage: test
  image: python:3.12
  script:
    - python -m pip install pytest
    - python -m pytest -v